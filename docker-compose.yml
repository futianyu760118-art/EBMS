services:
  ebms:
    build:
      context: .
      dockerfile: Dockerfile
    image: ebms:latest
    container_name: ebms
    ports:
      - "3010:3010"
    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
    environment:
      - PORT=3010
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - EBMS_APP_KEY=${EBMS_APP_KEY}
      - EBMS_APP_SECRET=${EBMS_APP_SECRET}
      - EBMS_EXTERNAL_API_KEY=${EBMS_EXTERNAL_API_KEY}
      # ---- AEOS 双向同步（PAND-307 切流 / PAND-309 R4 持久化）----
      # 入站：CRM 调 EBMS /api/aeos/ingest 时校验的令牌
      - EBMS_INGEST_TOKEN=${EBMS_INGEST_TOKEN}
      # 出站：EBMS 调 CRM /api/v1/integrations/ebms/ingest 时使用的令牌与地址
      - EBMS_INBOUND_TOKEN=${EBMS_INBOUND_TOKEN}
      - EBMS_CRM_INGEST_URL=${EBMS_CRM_INGEST_URL:-http://host.docker.internal:8000/api/v1/integrations/ebms/ingest}
      # 出站自动调度：默认每 5 分钟 flush；EBMS_AEOS_AUTOSYNC=0 可关闭
      - EBMS_AEOS_AUTOSYNC=${EBMS_AEOS_AUTOSYNC:-1}
      - EBMS_AEOS_FLUSH_INTERVAL_MS=${EBMS_AEOS_FLUSH_INTERVAL_MS:-300000}
      # 切流后核价→报价库自动同步默认停用（CRM 主写）；仅回滚演练置 1
      - EBMS_QUOTE_AUTOSYNC=${EBMS_QUOTE_AUTOSYNC:-0}
      # M01 已审批离职结果回写 EBMS；必须与 M01 使用同一个令牌
      - M01_EBMS_SYNC_TOKEN=${M01_EBMS_SYNC_TOKEN:?set M01_EBMS_SYNC_TOKEN in .env}
      # ---- M10 POMS 微系统对接（EBMS/M03 管理行动 → M10 执行面）----
      # M10 机器通道 Bearer 令牌；未配置时 /api/m10/partner/* 返回 503（fail-closed）
      - M10_PARTNER_TOKEN=${M10_PARTNER_TOKEN}
      # M10 门户地址（非机密，供 EBMS「微系统」页面跳转）
      - M10_PORTAL_URL=${M10_PORTAL_URL:-}
      # ---- AEOS 人员生命周期同步（Phase 1 统一契约，契约见 contracts/aeos-v1/）----
      # 端点 /internal/aeos/person-lifecycle（M02 EDP 分发 → EBMS adapter）；HMAC-SHA256 签名。
      # 未配置时端点 fail-closed 返回 503；代码内回退 M01_EBMS_SYNC_TOKEN。
      - AEOS_PERSON_LIFECYCLE_SECRET=${AEOS_PERSON_LIFECYCLE_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # always：无论退出码如何都自动拉起，避免进程消失后页面长期打不开
    restart: always
    # 给 Node 收尾/落盘留出时间，避免 SIGKILL 导致 SQLite 处于未 checkpoint 状态
    stop_grace_period: 30s
    # 限制日志体积，避免容器日志无限增长占满磁盘
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
